# Type-checks, tests and packages the extension on every pull request and on
# pushes to the long-lived branches. Uses the same runner setup as publish.yml,
# so a green run here means the release workflow's build job should pass too.

name: CI

on:
  pull_request:
  push:
    branches: [development, test, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type-check, test and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - run: npm run check-types

      # The tests run inside a real VS Code instance, which needs a display.
      - run: xvfb-run -a npm test

      - run: npx vsce package --out mystatus.vsix

      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: mystatus.vsix
          if-no-files-found: error
          retention-days: 7
